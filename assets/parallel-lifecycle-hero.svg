<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="600" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="19" fill="none" stroke="#1e2d44" stroke-width="2"/>

  <!-- title -->
  <text x="600" y="78" text-anchor="middle" font-size="46" font-weight="700" fill="#e8eefc">parallel-lifecycle</text>
  <text x="600" y="116" text-anchor="middle" font-size="21" fill="#7dd3fc">One isolated, disposable environment per git worktree.</text>
  <text x="600" y="146" text-anchor="middle" font-size="15" class="mono" fill="#5b6b85">different port · different Chrome · different database — zero collisions</text>

  <!-- main (left) -->
  <rect x="44" y="318" width="118" height="60" rx="12" fill="#16233c" stroke="#33415c" stroke-width="1.5"/>
  <text x="103" y="346" text-anchor="middle" font-size="17" font-weight="600" fill="#cbd5e1">main</text>
  <text x="103" y="366" text-anchor="middle" font-size="11" class="mono" fill="#64748b">branch off</text>

  <!-- fan-out arrows -->
  <path d="M168 348 C 300 348, 320 212, 432 212" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M168 348 L 432 348" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M168 348 C 300 348, 320 484, 432 484" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- worktree A -->
  <g>
    <rect x="438" y="178" width="328" height="68" rx="12" fill="#101c30" stroke="#1e3148" stroke-width="1.5"/>
    <rect x="438" y="178" width="6" height="68" rx="3" fill="#38bdf8"/>
    <text x="462" y="206" font-size="17" font-weight="600" fill="#e2e8f0" class="mono">feat/checkout</text>
    <text x="462" y="230" font-size="13" class="mono" fill="#38bdf8">:3174 · cdp :53314 · db wt_checkout</text>
  </g>
  <!-- worktree B -->
  <g>
    <rect x="438" y="314" width="328" height="68" rx="12" fill="#101c30" stroke="#1e3148" stroke-width="1.5"/>
    <rect x="438" y="314" width="6" height="68" rx="3" fill="#34d399"/>
    <text x="462" y="342" font-size="17" font-weight="600" fill="#e2e8f0" class="mono">fix/webhook</text>
    <text x="462" y="366" font-size="13" class="mono" fill="#34d399">:3209 · cdp :53317 · db wt_webhook</text>
  </g>
  <!-- worktree C -->
  <g>
    <rect x="438" y="450" width="328" height="68" rx="12" fill="#101c30" stroke="#1e3148" stroke-width="1.5"/>
    <rect x="438" y="450" width="6" height="68" rx="3" fill="#a78bfa"/>
    <text x="462" y="478" font-size="17" font-weight="600" fill="#e2e8f0" class="mono">spike/search</text>
    <text x="462" y="502" font-size="13" class="mono" fill="#a78bfa">:3360 · cdp :53321 · db wt_search</text>
  </g>

  <!-- converge arrows -->
  <path d="M768 212 C 880 212, 900 348, 1000 348" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M768 348 L 1000 348" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M768 484 C 880 484, 900 348, 1000 348" fill="none" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- merge (right) -->
  <rect x="1006" y="312" width="150" height="72" rx="12" fill="#13241c" stroke="#2f5b43" stroke-width="1.5"/>
  <text x="1081" y="343" text-anchor="middle" font-size="17" font-weight="600" fill="#bbf7d0">main ✓</text>
  <text x="1081" y="365" text-anchor="middle" font-size="11" class="mono" fill="#5e8b6f">merge / deploy</text>

  <!-- caption -->
  <text x="600" y="566" text-anchor="middle" font-size="14" fill="#5b6b85">N parallel sessions build end-to-end at once, behind one <tspan class="mono" fill="#7dd3fc">.env.worktree</tspan> contract, and converge cleanly back to main.</text>
</svg>
