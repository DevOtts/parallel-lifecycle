<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.mono { font-family: 'SF Mono','JetBrains Mono','Fira Code', Menlo, Consolas, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="20" fill="url(#abg)"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#1e2d44" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#e8eefc">A thin substrate, one contract between the layers</text>

  <!-- LAYER 0 -->
  <rect x="130" y="80" width="940" height="116" rx="14" fill="#101c30" stroke="#28527a" stroke-width="1.5"/>
  <rect x="130" y="80" width="940" height="30" rx="14" fill="#13243b"/>
  <rect x="130" y="96" width="940" height="14" fill="#13243b"/>
  <text x="152" y="100" font-size="13" font-weight="700" class="mono" fill="#7dd3fc">LAYER 0 · PROVISIONING</text>
  <text x="1048" y="100" text-anchor="end" font-size="12" fill="#5b6b85">hooks — deterministic, zero model discretion</text>
  <!-- chips -->
  <g font-size="14" class="mono">
    <rect x="160" y="132" width="190" height="42" rx="9" fill="#16273f" stroke="#243b59"/><text x="255" y="158" text-anchor="middle" fill="#cbd5e1">free app port</text>
    <rect x="372" y="132" width="230" height="42" rx="9" fill="#16273f" stroke="#243b59"/><text x="487" y="158" text-anchor="middle" fill="#cbd5e1">ephemeral Chrome / CDP</text>
    <rect x="624" y="132" width="248" height="42" rx="9" fill="#16273f" stroke="#243b59"/><text x="748" y="158" text-anchor="middle" fill="#94a3b8">per-worktree DB (planned)</text>
    <rect x="894" y="132" width="156" height="42" rx="9" fill="#16273f" stroke="#243b59"/><text x="972" y="158" text-anchor="middle" fill="#cbd5e1">lifecycle</text>
  </g>

  <!-- writes arrow -->
  <path d="M600 196 L600 248" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="616" y="228" font-size="13" fill="#7dd3fc">writes once</text>

  <!-- CONTRACT (thin waist) -->
  <rect x="372" y="250" width="456" height="92" rx="14" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="284" text-anchor="middle" font-size="22" font-weight="700" class="mono" fill="#7dd3fc">.env.worktree</text>
  <text x="600" y="316" text-anchor="middle" font-size="14" class="mono" fill="#9fb4cc">APP_PORT · CDP_URL · DATABASE_URL</text>
  <text x="352" y="300" text-anchor="end" font-size="12" fill="#5b6b85">the</text>
  <text x="352" y="316" text-anchor="end" font-size="12" fill="#5b6b85">thin waist</text>

  <!-- reads arrow -->
  <path d="M600 342 L600 394" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="616" y="374" font-size="13" fill="#34d399">reads — never hardcodes</text>

  <!-- LAYER 2 -->
  <rect x="130" y="396" width="940" height="116" rx="14" fill="#101c30" stroke="#2f5b43" stroke-width="1.5"/>
  <rect x="130" y="396" width="940" height="30" rx="14" fill="#13241c"/>
  <rect x="130" y="412" width="940" height="14" fill="#13241c"/>
  <text x="152" y="416" font-size="13" font-weight="700" class="mono" fill="#86efac">LAYER 2 · CAPABILITIES</text>
  <text x="1048" y="416" text-anchor="end" font-size="12" fill="#5b6b85">read the contract — single responsibility, no duplicated assumptions</text>
  <g font-size="14" class="mono">
    <rect x="250" y="448" width="180" height="42" rx="9" fill="#16273f" stroke="#27452f"/><text x="340" y="474" text-anchor="middle" fill="#cbd5e1">run the app</text>
    <rect x="452" y="448" width="180" height="42" rx="9" fill="#16273f" stroke="#27452f"/><text x="542" y="474" text-anchor="middle" fill="#cbd5e1">run tests</text>
    <rect x="654" y="448" width="200" height="42" rx="9" fill="#16273f" stroke="#27452f"/><text x="754" y="474" text-anchor="middle" fill="#cbd5e1">drive the browser</text>
  </g>
</svg>
